<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Leads Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb6c1;
    --pink-bright: #ff85a1;
    --pink-dim: rgba(255,182,193,0.13);
    --pink-glow: rgba(255,182,193,0.35);
    --black: #050505;
    --black2: #0d0d0d;
    --black3: #111;
    --white: #f5f0f0;
    --gray: rgba(255,255,255,0.35);
    --green: #a8e6b3;
    --red: #ffa0a0;
    --yellow: #ffe0a0;
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── LOGIN SCREEN ── */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 32px;
    position: relative;
    overflow: hidden;
  }

  #loginScreen::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 60% 40%, rgba(255,182,193,0.07) 0%, transparent 60%);
    pointer-events: none;
  }

  .login-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    text-align: center;
    line-height: 1.1;
  }
  .login-title span { color: var(--pink); }

  .login-sub {
    font-size: 0.8rem;
    color: var(--gray);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-align: center;
  }

  .login-card {
    background: var(--black2);
    border: 1px solid rgba(255,182,193,0.15);
    border-radius: 3px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    position: relative;
    overflow: hidden;
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
  }

  .login-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
  }
  .login-field label {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,182,193,0.55);
  }
  .login-field input {
    background: rgba(255,182,193,0.04);
    border: 1px solid rgba(255,182,193,0.15);
    border-radius: 2px;
    color: var(--white);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    width: 100%;
  }
  .login-field input:focus {
    border-color: rgba(255,182,193,0.5);
    box-shadow: 0 0 0 3px rgba(255,182,193,0.07);
  }

  .login-btn {
    width: 100%;
    background: var(--pink);
    color: #000;
    border: none;
    border-radius: 2px;
    padding: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.73rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .login-btn:hover {
    background: var(--pink-bright);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(255,182,193,0.2);
  }

  .login-error {
    color: var(--red);
    font-size: 0.75rem;
    text-align: center;
    margin-top: 12px;
    display: none;
  }
  .login-error.show { display: block; }

  /* ── DASHBOARD ── */
  #dashboard { display: none; }
  #dashboard.show { display: block; }

  /* NAV */
  .dash-nav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 48px;
    height: 64px;
    background: rgba(5,5,5,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,182,193,0.08);
  }

  .dash-logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    color: var(--pink);
    letter-spacing: 0.05em;
  }
  .dash-logo span {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gray);
    font-family: 'DM Sans', sans-serif;
    margin-left: 10px;
    font-weight: 300;
  }

  .dash-actions { display: flex; gap: 12px; align-items: center; }

  .btn-refresh {
    background: none;
    border: 1px solid rgba(255,182,193,0.2);
    color: rgba(255,182,193,0.6);
    padding: 7px 16px;
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-refresh:hover { border-color: var(--pink); color: var(--pink); }

  .btn-logout {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .btn-logout:hover { color: var(--red); }

  /* MAIN */
  .dash-main {
    padding: 48px;
    max-width: 1400px;
    margin: 0 auto;
  }

  /* STATS ROW */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 48px;
  }

  .stat-card {
    background: var(--black2);
    border: 1px solid rgba(255,182,193,0.1);
    border-radius: 2px;
    padding: 28px 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .stat-card:hover { border-color: rgba(255,182,193,0.3); }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
    opacity: 0.5;
  }

  .stat-label {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,182,193,0.45);
    margin-bottom: 12px;
  }
  .stat-num {
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    font-weight: 700;
    color: var(--pink);
    line-height: 1;
  }

  /* SECTION HEADER */
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 700;
  }
  .section-title span { color: var(--pink); }

  .filter-row {
    display: flex;
    gap: 8px;
  }
  .filter-btn {
    background: none;
    border: 1px solid rgba(255,182,193,0.15);
    color: var(--gray);
    padding: 6px 14px;
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn:hover,
  .filter-btn.active { border-color: var(--pink); color: var(--pink); background: var(--pink-dim); }

  /* LEADS TABLE */
  .leads-wrap {
    background: var(--black2);
    border: 1px solid rgba(255,182,193,0.1);
    border-radius: 3px;
    overflow: hidden;
  }

  .leads-table {
    width: 100%;
    border-collapse: collapse;
  }

  .leads-table th {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,182,193,0.4);
    font-weight: 400;
    padding: 16px 20px;
    text-align: left;
    border-bottom: 1px solid rgba(255,182,193,0.08);
    background: rgba(255,182,193,0.02);
  }

  .leads-table td {
    padding: 18px 20px;
    font-size: 0.82rem;
    border-bottom: 1px solid rgba(255,182,193,0.05);
    vertical-align: middle;
    color: rgba(255,255,255,0.75);
  }

  .leads-table tr:last-child td { border-bottom: none; }

  .leads-table tr:hover td {
    background: rgba(255,182,193,0.03);
    color: var(--white);
  }

  .lead-name {
    font-weight: 500;
    color: var(--white);
    font-size: 0.88rem;
  }
  .lead-email {
    font-size: 0.75rem;
    color: var(--gray);
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
  }

  .lead-phone {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 0.62rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    border: 1px solid;
  }
  .badge-pending {
    color: var(--yellow);
    border-color: rgba(255,224,160,0.3);
    background: rgba(255,224,160,0.07);
  }
  .badge-called {
    color: var(--green);
    border-color: rgba(168,230,179,0.3);
    background: rgba(168,230,179,0.07);
  }
  .badge-failed {
    color: var(--red);
    border-color: rgba(255,160,160,0.3);
    background: rgba(255,160,160,0.07);
  }

  .interest-yes { color: var(--green); font-size: 0.75rem; }
  .interest-no { color: var(--red); font-size: 0.75rem; }
  .interest-unknown { color: var(--gray); font-size: 0.75rem; }

  .scheduled-time {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    color: rgba(255,182,193,0.6);
  }

  .service-tag {
    font-size: 0.65rem;
    border: 1px solid rgba(255,182,193,0.2);
    color: rgba(255,182,193,0.6);
    padding: 3px 8px;
    border-radius: 100px;
    white-space: nowrap;
  }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 80px 40px;
    color: var(--gray);
  }
  .empty-icon { font-size: 2.5rem; margin-bottom: 16px; opacity: 0.4; }
  .empty-text { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: rgba(255,255,255,0.3); }

  /* LOADING */
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--gray);
  }
  .loading-dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--pink);
    border-radius: 50%;
    margin: 0 3px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* DETAIL PANEL */
  .detail-btn {
    background: none;
    border: 1px solid rgba(255,182,193,0.15);
    color: rgba(255,182,193,0.5);
    width: 28px; height: 28px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .detail-btn:hover { border-color: var(--pink); color: var(--pink); }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(5,5,5,0.85);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.show { display: flex; }

  .modal {
    background: var(--black2);
    border: 1px solid rgba(255,182,193,0.2);
    border-radius: 3px;
    padding: 40px;
    width: 100%;
    max-width: 560px;
    position: relative;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
  }

  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: none;
    border: 1px solid rgba(255,182,193,0.15);
    color: var(--gray);
    width: 28px; height: 28px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }

  .modal-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  .modal-service { font-size: 0.75rem; color: var(--pink); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 24px; }

  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
  }
  .modal-field label {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,182,193,0.4);
    display: block;
    margin-bottom: 4px;
  }
  .modal-field p {
    font-size: 0.85rem;
    color: var(--white);
    font-family: 'DM Mono', monospace;
  }

  .modal-desc {
    background: rgba(255,182,193,0.04);
    border: 1px solid rgba(255,182,193,0.1);
    border-radius: 2px;
    padding: 14px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .modal-summary {
    background: rgba(168,230,179,0.05);
    border: 1px solid rgba(168,230,179,0.15);
    border-radius: 2px;
    padding: 14px;
    font-size: 0.82rem;
    color: rgba(255,255,255,0.6);
    line-height: 1.7;
  }

  .modal-divider {
    height: 1px;
    background: rgba(255,182,193,0.08);
    margin: 20px 0;
  }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .dash-nav { padding: 0 24px; }
    .dash-main { padding: 24px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .leads-table th:nth-child(4),
    .leads-table td:nth-child(4),
    .leads-table th:nth-child(6),
    .leads-table td:nth-child(6) { display: none; }
  }

  @media (max-width: 600px) {
    .stats-row { grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div>
    <div class="login-title">Admin <span>Dashboard</span></div>
    <p class="login-sub" style="margin-top:8px;">Anvita · Leads & Calls</p>
  </div>
  <div class="login-card">
    <div class="login-field">
      <label>Admin Password</label>
      <input type="password" id="passwordInput" placeholder="Enter your admin key" autocomplete="current-password">
    </div>
    <button class="login-btn" id="loginBtn">Enter Dashboard →</button>
    <p class="login-error" id="loginError">Wrong password. Try again.</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <nav class="dash-nav">
    <div class="dash-logo">Anvita <span>Lead Dashboard</span></div>
    <div class="dash-actions">
      <button class="btn-refresh" id="refreshBtn">↻ Refresh</button>
      <button class="btn-logout" id="logoutBtn">Sign Out</button>
    </div>
  </nav>

  <div class="dash-main">
    <!-- STATS -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Total Leads</div>
        <div class="stat-num" id="statTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending Calls</div>
        <div class="stat-num" id="statPending" style="color:var(--yellow)">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Calls Made</div>
        <div class="stat-num" id="statCalled" style="color:var(--green)">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Interested</div>
        <div class="stat-num" id="statInterested" style="color:var(--pink)">—</div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="section-header">
      <div class="section-title">All <span>Leads</span></div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="called">Called</button>
        <button class="filter-btn" data-filter="failed">Failed</button>
      </div>
    </div>

    <div class="leads-wrap">
      <div class="loading" id="loadingState">
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
        <div class="loading-dot"></div>
      </div>
      <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-icon">✦</div>
        <div class="empty-text">No leads yet.</div>
      </div>
      <table class="leads-table" id="leadsTable" style="display:none">
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Service</th>
            <th>Scheduled</th>
            <th>Call Status</th>
            <th>Interested</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent">
    <button class="modal-close" id="modalClose">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script>
  const BACKEND = 'https://portfolio-backend-1-avg1.onrender.com';
  let adminKey = '';
  let allLeads = [];
  let currentFilter = 'all';

  // ── LOGIN ──
  document.getElementById('loginBtn').addEventListener('click', tryLogin);
  document.getElementById('passwordInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') tryLogin();
  });

  function tryLogin() {
    const val = document.getElementById('passwordInput').value.trim();
    if (!val) return;
    adminKey = val;
    fetchLeads(true);
  }

  function tryLoginSuccess() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('show');
  }

  function showLoginError() {
    document.getElementById('loginError').classList.add('show');
    document.getElementById('passwordInput').value = '';
    adminKey = '';
  }

  // ── LOGOUT ──
  document.getElementById('logoutBtn').addEventListener('click', () => {
    adminKey = '';
    allLeads = [];
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('dashboard').classList.remove('show');
    document.getElementById('passwordInput').value = '';
    document.getElementById('loginError').classList.remove('show');
  });

  // ── REFRESH ──
  document.getElementById('refreshBtn').addEventListener('click', () => fetchLeads(false));

  // ── FETCH LEADS ──
  async function fetchLeads(isLogin) {
    try {
      const res = await fetch(`${BACKEND}/leads`, {
        headers: { 'x-admin-key': adminKey }
      });

      if (res.status === 401) {
        if (isLogin) showLoginError();
        return;
      }

      if (!res.ok) throw new Error('Server error');

      const data = await res.json();
      allLeads = data;

      if (isLogin) tryLoginSuccess();
      updateStats();
      renderTable();

    } catch (err) {
      if (isLogin) showLoginError();
      console.error(err);
    }
  }

  // ── STATS ──
  function updateStats() {
    document.getElementById('statTotal').textContent = allLeads.length;
    document.getElementById('statPending').textContent = allLeads.filter(l => l.callStatus === 'pending').length;
    document.getElementById('statCalled').textContent = allLeads.filter(l => l.callStatus === 'called').length;
    document.getElementById('statInterested').textContent = allLeads.filter(l => l.interested === 'yes').length;
  }

  // ── FILTERS ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderTable();
    });
  });

  // ── RENDER TABLE ──
  function renderTable() {
    document.getElementById('loadingState').style.display = 'none';

    const filtered = currentFilter === 'all'
      ? allLeads
      : allLeads.filter(l => l.callStatus === currentFilter);

    if (filtered.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('leadsTable').style.display = 'none';
      return;
    }

    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('leadsTable').style.display = 'table';

    const tbody = document.getElementById('leadsBody');
    tbody.innerHTML = '';

    filtered.forEach(lead => {
      const tr = document.createElement('tr');

      const statusBadge = {
        pending: '<span class="badge badge-pending">⏳ Pending</span>',
        called:  '<span class="badge badge-called">✓ Called</span>',
        failed:  '<span class="badge badge-failed">✕ Failed</span>'
      }[lead.callStatus] || '<span class="badge badge-pending">—</span>';

      const interestEl = {
        yes:     '<span class="interest-yes">✓ Yes</span>',
        no:      '<span class="interest-no">✕ No</span>',
        unknown: '<span class="interest-unknown">— Unknown</span>'
      }[lead.interested] || '<span class="interest-unknown">—</span>';

      const date = lead.scheduledTime
        ? `<div class="scheduled-time">${lead.scheduledTime}</div>`
        : '<span style="color:var(--gray);font-size:0.75rem">—</span>';

      tr.innerHTML = `
        <td>
          <div class="lead-name">${lead.fname} ${lead.lname || ''}</div>
          <div class="lead-email">${lead.email}</div>
        </td>
        <td><span class="lead-phone">${lead.phone}</span></td>
        <td><span class="service-tag">${lead.service || '—'}</span></td>
        <td>${date}</td>
        <td>${statusBadge}</td>
        <td>${interestEl}</td>
        <td><button class="detail-btn" data-id="${lead._id}">→</button></td>
      `;

      tbody.appendChild(tr);
    });

    // Detail buttons
    document.querySelectorAll('.detail-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lead = allLeads.find(l => l._id === btn.dataset.id);
        if (lead) openModal(lead);
      });
    });
  }

  // ── MODAL ──
  function openModal(lead) {
    const statusBadge = {
      pending: '<span class="badge badge-pending">⏳ Pending</span>',
      called:  '<span class="badge badge-called">✓ Called</span>',
      failed:  '<span class="badge badge-failed">✕ Failed</span>'
    }[lead.callStatus] || '—';

    const interestEl = {
      yes:     '<span class="interest-yes" style="font-size:0.9rem">✓ Interested</span>',
      no:      '<span class="interest-no" style="font-size:0.9rem">✕ Not Interested</span>',
      unknown: '<span class="interest-unknown" style="font-size:0.9rem">— Unknown</span>'
    }[lead.interested] || '—';

    const createdAt = lead.createdAt
      ? new Date(lead.createdAt).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })
      : '—';

    document.getElementById('modalBody').innerHTML = `
      <div class="modal-name">${lead.fname} ${lead.lname || ''}</div>
      <div class="modal-service">${lead.service || 'No service selected'}</div>

      <div class="modal-grid">
        <div class="modal-field"><label>Email</label><p>${lead.email}</p></div>
        <div class="modal-field"><label>Phone</label><p>${lead.phone}</p></div>
        <div class="modal-field"><label>Call Status</label><p>${statusBadge}</p></div>
        <div class="modal-field"><label>Interested</label><p>${interestEl}</p></div>
        <div class="modal-field"><label>Scheduled</label><p style="font-size:0.78rem">${lead.scheduledTime || '—'}</p></div>
        <div class="modal-field"><label>Submitted</label><p style="font-size:0.78rem">${createdAt}</p></div>
      </div>

      ${lead.desc ? `
        <div class="modal-divider"></div>
        <div class="modal-field" style="margin-bottom:10px"><label>Project Description</label></div>
        <div class="modal-desc">${lead.desc}</div>
      ` : ''}

      ${lead.callSummary ? `
        <div class="modal-divider"></div>
        <div class="modal-field" style="margin-bottom:10px"><label>AI Call Summary</label></div>
        <div class="modal-summary">${lead.callSummary}</div>
      ` : ''}

      ${lead.vapiCallId ? `
        <div class="modal-divider"></div>
        <div class="modal-field"><label>Vapi Call ID</label><p style="font-size:0.72rem;opacity:0.5">${lead.vapiCallId}</p></div>
      ` : ''}
    `;

    document.getElementById('modalOverlay').classList.add('show');
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  // ESC to close
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
